databases:
  - name: mettalent-db
    databaseName: mettalent
    user: mettalent

services:
  - type: web
    name: mettalent-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mettalent-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://mettalent.org,https://www.mettalent.org
      - key: NODE_ENV
        value: production
